<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <!-- ── Mobile Backdrop ── -->
  <div class="sidebar-backdrop"
       [class.visible]="sidebarMobileOpen"
       (click)="closeMobileSidebar()"></div>

  <!-- ── Sidebar ── -->
  <aside class="sidebar" [class.mobile-open]="sidebarMobileOpen">
    <!-- Brand -->
    <div class="sidebar-brand">
      <button class="brand-icon" (click)="toggleSidebar()" title="Toggle sidebar">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="6" fill="rgba(255,255,255,0.15)"/>
          <path d="M7 8h10M7 12h10M7 16h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="brand-text">
        <span class="brand-title">जन शिकायत</span>
        <span class="brand-sub">Home Dept., Bihar</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
        </span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a routerLink="/complaints" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </span>
        <span class="nav-label">Complaints</span>
      </a>

      <a *ngIf="canRegisterComplaint" routerLink="/complaints/new" routerLinkActive="active" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </span>
        <span class="nav-label">New Complaint</span>
      </a>

      <a *ngIf="canManageUsers" routerLink="/admin/users" routerLinkActive="active" class="nav-item" (click)="closeMobileSidebar()">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </span>
        <span class="nav-label">User Management</span>
      </a>
    </nav>
  </aside>

  <!-- ── Top Bar ── -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" (click)="toggleSidebar()" title="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-title">Jan Shikayat Portal</span>
    </div>

    <div class="topbar-right" *ngIf="auth.currentUser() as user">
      <div class="user-profile" (click)="toggleUserMenu()">
        <div class="user-avatar">{{ getUserInitials() }}</div>
        <div class="user-info">
          <span class="user-name">{{ user.fullName }}</span>
          <span class="user-role">{{ user.role }}</span>
        </div>
        <svg class="chevron" [class.rotated]="userMenuOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>

      <!-- User Dropdown -->
      <div class="user-dropdown" [class.open]="userMenuOpen">
        <div class="dropdown-header">
          <div class="user-avatar lg">{{ getUserInitials() }}</div>
          <div>
            <div class="dropdown-name">{{ user.fullName }}</div>
            <div class="dropdown-email">{{ user.email }}</div>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item logout" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Log out
        </button>
      </div>

      <!-- Backdrop for dropdown -->
      <div class="dropdown-backdrop" *ngIf="userMenuOpen" (click)="closeUserMenu()"></div>
    </div>
  </header>

  <!-- ── Main Content ── -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
