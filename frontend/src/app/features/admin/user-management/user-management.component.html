<div class="page-header">
  <h1>उपयोगकर्ता प्रबंधन</h1>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="card form-narrow">
  <div class="form-field">
    <label>पूरा नाम *</label>
    <input type="text" formControlName="fullName" />
  </div>
  <div class="form-field">
    <label>पदनाम</label>
    <input type="text" formControlName="designation" placeholder="जैसे एसडीओ पटना सदर" />
  </div>
  <div class="form-field">
    <label>ईमेल *</label>
    <input type="email" formControlName="email" />
  </div>
  <div class="form-field">
    <label>अस्थायी पासवर्ड *</label>
    <input type="password" formControlName="password" />
  </div>
  <div class="form-field">
    <label>भूमिका *</label>
    <select formControlName="role">
      <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
    </select>
  </div>
  <div class="form-field" *ngIf="form.value.role === 'BranchOfficer'">
    <label>शाखा (42 में से 1)</label>
    <select formControlName="branchId">
      <option [ngValue]="null">शाखा चुनें</option>
      <option *ngFor="let b of branches" [ngValue]="b.id">{{ b.code }} — {{ b.name }}</option>
    </select>
  </div>
  <div class="form-field" *ngIf="form.value.role === 'DepartmentHead'">
    <label>विभाग</label>
    <select formControlName="departmentId">
      <option [ngValue]="null">विभाग चुनें</option>
      <option *ngFor="let d of departments" [ngValue]="d.id">{{ d.name }}</option>
    </select>
  </div>

  <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>
  <p class="success-text" *ngIf="message">{{ message }}</p>

  <button type="submit" class="btn btn-primary" [disabled]="submitting">
    {{ submitting ? 'बनाया जा रहा है…' : 'खाता बनाएं' }}
  </button>
</form>
