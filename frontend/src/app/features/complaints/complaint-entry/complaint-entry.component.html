<div class="page-header">
  <h1>Register New Complaint</h1>
</div>

<form [formGroup]="form" (ngSubmit)="submit()" class="card">
  <h2 class="section-title">Applicant Details</h2>
  <div class="form-grid">
    <div class="form-field">
      <label>Applicant Name *</label>
      <input type="text" formControlName="applicantName" />
    </div>
    <div class="form-field">
      <label>Father / Husband / Guardian Name *</label>
      <input type="text" formControlName="guardianName" />
    </div>
    <div class="form-field">
      <label>Mobile Number *</label>
      <input type="text" maxlength="10" formControlName="mobileNumber" placeholder="10-digit mobile number" />
    </div>
    <div class="form-field">
      <label>Email (optional)</label>
      <input type="email" formControlName="email" />
    </div>
    <div class="form-field full-width">
      <label>Address *</label>
      <input type="text" formControlName="address" />
    </div>
    <div class="form-field">
      <label>District *</label>
      <input type="text" formControlName="district" />
    </div>
    <div class="form-field">
      <label>Block / Prakhand *</label>
      <input type="text" formControlName="block" />
    </div>
    <div class="form-field">
      <label>Police Station</label>
      <input type="text" formControlName="policeStation" />
    </div>
    <div class="form-field">
      <label>Area / Locality</label>
      <input type="text" formControlName="area" />
    </div>
    <div class="form-field">
      <label>Opposite Party (if any)</label>
      <input type="text" formControlName="oppositeParty" />
    </div>
  </div>

  <h2 class="section-title">Complaint Details</h2>
  <div class="form-grid">
    <div class="form-field full-width">
      <label>Subject *</label>
      <input type="text" formControlName="subject" />
    </div>
    <div class="form-field">
      <label>Category *</label>
      <input type="text" formControlName="category" placeholder="e.g. Land Issue" />
    </div>
    <div class="form-field">
      <label>Sub-category</label>
      <input type="text" formControlName="subCategory" />
    </div>
    <div class="form-field full-width">
      <label>Detailed Description *</label>
      <textarea rows="4" formControlName="description"></textarea>
    </div>
    <div class="form-field">
      <label>Complaint Date *</label>
      <input type="date" formControlName="complaintDate" />
    </div>
    <div class="form-field">
      <label>Source</label>
      <select formControlName="source">
        <option *ngFor="let s of sources" [value]="s">{{ s }}</option>
      </select>
    </div>
    <div class="form-field">
      <label>Branch / Section *</label>
      <select formControlName="branchId">
        <option [ngValue]="null" disabled>Select branch</option>
        <option *ngFor="let b of branches" [ngValue]="b.id">{{ b.code }} — {{ b.name }}</option>
      </select>
    </div>
    <div class="form-field">
      <label>Related Department</label>
      <select formControlName="departmentId">
        <option [ngValue]="null">Not yet known</option>
        <option *ngFor="let d of departments" [ngValue]="d.id">{{ d.name }}</option>
      </select>
    </div>
    <div class="form-field full-width">
      <label>Attach Complaint PDF (optional)</label>
      <input type="file" accept="application/pdf" (change)="onFileSelected($event)" />
      <span *ngIf="selectedFile" class="file-chosen">Selected: {{ selectedFile.name }}</span>
    </div>
  </div>

  <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="submitting">
      {{ submitting ? 'Submitting…' : 'Register Complaint' }}
    </button>
  </div>
</form>
