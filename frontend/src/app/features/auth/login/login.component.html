<div class="login-page">
  <div class="login-card card">
    <div class="login-header">
      <h1>जन शिकायत पोर्टल</h1>
      <p>लोक शिकायत प्रबंधन प्रणाली &middot; गृह विभाग, बिहार</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="email">ईमेल</label>
        <input id="email" type="email" formControlName="email" placeholder="you@janshikayat.gov.in" />
        <span class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          कृपया मान्य ईमेल पता दर्ज करें।
        </span>
      </div>

      <div class="form-field">
        <label for="password">पासवर्ड</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="eye-btn"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'पासवर्ड छुपाएं' : 'पासवर्ड दिखाएं'"
          >
            <!-- Eye icon (show) -->
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon (hide) -->
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span class="error-text" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          पासवर्ड आवश्यक है।
        </span>
      </div>

      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="loading">
        {{ loading ? 'लॉग इन हो रहा है…' : 'लॉग इन करें' }}
      </button>
    </form>

    <div class="demo-accounts">
      <p class="demo-title">डेमो खाते (पहली बार चलाने पर बनाए गए):</p>
      <button
        type="button"
        class="demo-chip"
        *ngFor="let acc of demoAccounts"
        (click)="fillDemo(acc.email, acc.password)">
        {{ acc.role }}
      </button>
    </div>
  </div>
</div>
