<div class="login-page">
  <div class="login-card card">
    <div class="login-header">
      <h1>जन शिकायत पोर्टल</h1>
      <p>Public Grievance Management System &middot; Home Department, Bihar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@janshikayat.gov.in" />
        <span class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
          Enter a valid email address.
        </span>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
        <span class="error-text" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          Password is required.
        </span>
      </div>

      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn btn-primary login-btn" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Log in' }}
      </button>
    </form>

    <div class="demo-accounts">
      <p class="demo-title">Demo accounts (seeded on first run):</p>
      <button
        type="button"
        class="demo-chip"
        *ngFor="let acc of demoAccounts"
        (click)="fillDemo(acc.email, acc.password)">
        {{ acc.role }}
      </button>
    </div>
  </div>
</div>
